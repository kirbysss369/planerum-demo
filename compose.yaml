services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: methodist
      PGDATABASE: methodist
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGSSLMODE: disable
      CLOUD_API_KEY: ${CLOUD_API_KEY:?Set CLOUD_API_KEY in .env}
      CLOUD_MODEL_ID: ${CLOUD_MODEL_ID:?Set CLOUD_MODEL_ID in .env}
      CLOUD_ALLOWED_MODEL_IDS: ${CLOUD_ALLOWED_MODEL_IDS:?Set CLOUD_ALLOWED_MODEL_IDS in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      ARTIFACT_ROOT: /app/data/artifacts
    volumes:
      - artifacts:/app/data/artifacts
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: methodist
      POSTGRES_USER: methodist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U methodist -d methodist"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  artifacts:
